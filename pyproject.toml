[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["backend/src", "backend/tests"]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "backend"
follow_imports = "silent"
exclude = "(?x)(^pycore/)"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
timeout = 120
